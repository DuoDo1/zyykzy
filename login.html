<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>输入访问口令</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172033;
        --muted: #667085;
        --line: #d9e2ec;
        --accent: #e15d47;
        --accent-dark: #b93f2e;
        --paper: #fffaf5;
        --blue: #356c9f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 15% 12%, rgba(225, 93, 71, 0.18), transparent 28%),
          radial-gradient(circle at 86% 18%, rgba(53, 108, 159, 0.16), transparent 24%),
          linear-gradient(135deg, #fffaf5 0%, #f5f8fb 48%, #fff1ea 100%);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
      }

      .card {
        width: min(100%, 430px);
        padding: 32px;
        border: 1px solid rgba(23, 32, 51, 0.12);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 24px 80px rgba(23, 32, 51, 0.12);
        backdrop-filter: blur(14px);
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--blue);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 8vw, 40px);
        line-height: 1.08;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.75;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 800;
      }

      input {
        width: 100%;
        height: 52px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        color: var(--ink);
        font: inherit;
      }

      input:focus-visible,
      button:focus-visible {
        outline: 3px solid rgba(225, 93, 71, 0.32);
        outline-offset: 2px;
      }

      button {
        width: 100%;
        height: 52px;
        margin-top: 14px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: white;
        font: inherit;
        font-weight: 900;
        cursor: pointer;
        transition: background 180ms ease, transform 180ms ease;
      }

      button:hover {
        background: var(--accent-dark);
      }

      .error {
        min-height: 22px;
        margin-top: 14px;
        color: #b42318;
        font-size: 14px;
      }

      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <form class="card" method="post" action="/unlock">
      <p class="eyebrow">恋爱控制欲占有欲指数测评</p>
      <h1>恋爱控制欲占有欲指数测评</h1>
      <p>恋爱控制欲占有欲指数测评</p>
      <label for="code">访问口令</label>
      <input id="code" name="code" type="password" autocomplete="one-time-code" required />
      <button type="submit">解锁测评</button>
      <div class="error" id="error" role="status"></div>
    </form>
    <script>
      const params = new URLSearchParams(location.search);
      if (params.get("error")) {
        document.getElementById("error").textContent = "口令不正确，请检查后重试。";
      }
    </script>
  </body>
</html>
